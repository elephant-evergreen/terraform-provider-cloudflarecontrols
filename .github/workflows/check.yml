name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.11.0
      - name: Verify the Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.4.0 --repo github/gh-actions-lock --pattern linux-amd64 --output "$RUNNER_TEMP/gh-actions-lock"
          echo "f9da98f2a6e9e0ae77deadf9a2319a8a86bb002b541cc3203b247cc59fb04842  $RUNNER_TEMP/gh-actions-lock" | sha256sum --check
          chmod +x "$RUNNER_TEMP/gh-actions-lock"
          "$RUNNER_TEMP/gh-actions-lock" --verify
      - run: mise run check
      - run: mise run licenses
      - name: Verify release packages
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.2
          args: release --snapshot --clean --skip=publish,sign --parallelism 2
